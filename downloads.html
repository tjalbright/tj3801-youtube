<!DOCTYPE html>
<html>
<head>
  <title>TJ3801 Youtube Official</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <style>
    body {
  background-color: #bde6ff;
     color: black;
     font-family: Arial, sans-serif;
     text-align: center;
     margin-top: 100px;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .hero {
      background-image: url('background.jpeg');
      background-attachment: fixed;  /* this is the magic */
      background-size: cover;
      background-position: center;
      height: 100vh;
    }
    table {
     width: 100%;
     max-width: 800px;
     border-collapse: collapse;
     margin: 0 auto;
    }
  </style>
</head>

<body>
  <h1>Downloads</h1>
  <p>this is where you shall find all my files</p>
  
  <table>
    <thead>
      <tr>
        <th>File</th>
        <th>Video</th>
        <th>Video Released</th>
      </tr>
    </thead>
    <tbody id="fileList"></tbody>
  </table>

  <script>
    fetch('/files.json')
      .then(res => res.json())
      .then(files => {
        const tbody = document.getElementById('fileList');
        files.forEach(file => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><a href="/files/${file.filename}">${file.displayName}</a></td>
            <td>${file.videoName}</td>
            <td>${file.videoReleased ? '✅ Yes' : '❌ Not yet'}</td>
          `;
          tbody.appendChild(row);
        });
      });
  </script>

</body>
</html>
