<!DOCTYPE html>
<html>
<head>
  <title>Downloads</title>
  <style>
    body {
      background-color: #bde6ff;
      color: black;
      font-family: Arial, sans-serif;
      padding: 40px;
    }
    input {
      width: 100%;
      max-width: 800px;
      padding: 10px;
      margin: 0 auto 20px auto;
      display: block;
      background: #EEE;
      border: 1px solid #CCC;
      border-radius: 8px;
      color: black;
      font-size: 16px;
    }
    table {
      width: 100%;
      max-width: 800px;
      border-collapse: collapse;
      margin: 0 auto;
    }
    th, td {
      padding: 12px;
      border: 1px solid #DDD;
      text-align: left;
    }
    th {
      background-color: #EEE;
    }
    a {
      color: rgb(0, 91, 249);
    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">Downloads</h1>
  <input type="text" id="search" placeholder="Search files...">
  <table>
    <thead>
      <tr>
        <th>File</th>
        <th>Video</th>
        <th>Video Released Yet? </th>
        <th>Date Uploaded</th>
      </tr>
    </thead>
    <tbody id="fileList"></tbody>
  </table>

  <script>
    let allFiles = [];

    fetch('/files.json')
      .then(res => res.json())
      .then(files => {
        allFiles = files;
        renderTable(files);
      });

    document.getElementById('search').addEventListener('input', function() {
      const query = this.value.toLowerCase();
      const filtered = allFiles.filter(file =>
        file.displayName.toLowerCase().includes(query) ||
        file.videoName.toLowerCase().includes(query) ||
        file.date.includes(query) ||
        file.filename.includes(query)
      );
      renderTable(filtered);
    });

    function renderTable(files) {
      const tbody = document.getElementById('fileList');
      tbody.innerHTML = '';
      files.forEach(file => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><a href="/files/${file.filename}">${file.displayName}</a></td>
          <td>${file.videoName}</td>
          <td>${file.videoReleased ? '✅ Yes' : '❌ Not yet'}</td>
          <td>${file.date}</td>
        `;
        tbody.appendChild(row);
      });
    }
  </script>
</body>
</html>
